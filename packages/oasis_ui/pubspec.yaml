name: oasis_ui
description: The Oasis design system. Themes, glass surfaces, controls and window chrome shared by the desktop and every bundled app.
resolution: workspace
version: 0.5.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.30.0"

dependencies:
  clock: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  crypto: ^3.0.6
  shared_preferences: ^2.3.0
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
