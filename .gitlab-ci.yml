stages:
  - test
  - sync
  - release
  - pages

default:
  tags: [linux-truenas]

variables:
  COCOGITTO_VERSION: "7.0.0"
  FLUTTER_VERSION: "3.47.7"

.flutter:
  before_script:
    - git -C /sdks/flutter fetch --depth 1 origin tag "$FLUTTER_VERSION"
    - git -C /sdks/flutter checkout -q FETCH_HEAD
    - flutter --version

test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  extends: .flutter
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  script:
    - flutter pub get
    - flutter analyze
    - flutter test --coverage
    - |
      python3 - <<'PY'
      lf = lh = 0
      for line in open('coverage/lcov.info'):
          if line.startswith('LF:'):
              lf += int(line[3:])
          elif line.startswith('LH:'):
              lh += int(line[3:])
      print(f'line coverage {lh}/{lf}')
      assert lf > 0 and lh == lf, f'coverage {lh}/{lf} not 100%'
      PY
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
      - test/failures/

integration:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  extends: .flutter
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libseat-dev libxcb1-dev libdrm-dev xvfb xauth
    - export XDG_RUNTIME_DIR=/tmp/xdg-runtime && mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
    - apt-get install -y --no-install-recommends meson libpixman-1-dev libudev-dev libseat-dev libinput-dev libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev hwdata libdisplay-info-dev libliftoff-dev libxcb1-dev libxcb-composite0-dev libxcb-icccm4-dev libxcb-ewmh-dev libxcb-render0-dev libxcb-res0-dev libxcb-errors-dev xwayland || true
    - git clone --depth 1 --branch 0.19.3 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
    - meson setup /tmp/wlroots/build /tmp/wlroots -Dxwayland=enabled -Dbackends= -Dexamples=false -Dtests=false -Drenderers=gles2 -Dallocators=gbm -Dwerror=false
    - ninja -C /tmp/wlroots/build && ninja -C /tmp/wlroots/build install
    - cp /tmp/wlroots/build/protocol/*-protocol.h /usr/local/include/wlroots-0.19/
    - cd de && flutter pub get && xvfb-run -a flutter test integration_test -d linux

native-build:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  extends: .flutter
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libwayland-dev wayland-protocols libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libseat-dev libxcb1-dev libdrm-dev
    - apt-get install -y --no-install-recommends meson libpixman-1-dev libudev-dev libseat-dev libinput-dev libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev hwdata libdisplay-info-dev libliftoff-dev libxcb1-dev libxcb-composite0-dev libxcb-icccm4-dev libxcb-ewmh-dev libxcb-render0-dev libxcb-res0-dev libxcb-errors-dev xwayland || true
    - git clone --depth 1 --branch 0.19.3 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
    - meson setup /tmp/wlroots/build /tmp/wlroots -Dxwayland=enabled -Dbackends= -Dexamples=false -Dtests=false -Drenderers=gles2 -Dallocators=gbm -Dwerror=false
    - ninja -C /tmp/wlroots/build && ninja -C /tmp/wlroots/build install
    - cp /tmp/wlroots/build/protocol/*-protocol.h /usr/local/include/wlroots-0.19/
    - cd de && flutter build linux --debug

packaging:
  stage: test
  image: debian:stable-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends dpkg-dev patchelf bash
    - sh scripts/verify-packaging.sh

github-sync:
  stage: sync
  image: alpine:latest
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache git openssh-client curl python3 bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$GITHUB_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || echo "$GITHUB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git remote add github git@github.com:justacalico/oasis-de.git || git remote set-url github git@github.com:justacalico/oasis-de.git
    - git fetch --unshallow github main 2>/dev/null || true
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push github "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG" --force
      else
        git push github HEAD:refs/heads/main --force-with-lease
      fi
    - bash scripts/watch-github-run.sh

auto-release:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache git openssh-client curl python3 ca-certificates tar gzip bash
    - curl -fsSL "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tgz
    - tar xzf /tmp/cog.tgz -C /usr/local/bin --strip-components=1
    - cog --version
    - git config user.email "ci@oasis.local" && git config user.name "ci"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch --unshallow 2>/dev/null || git fetch --all --tags
    - git tag -l | xargs -r git tag -d
    - git fetch --tags --force
    - |
      if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
        echo "HEAD already tagged, skipping"
        exit 0
      fi
      if ! cog bump --auto; then
        echo "no bump needed"
        exit 0
      fi
      TAG="$(git describe --tags --exact-match HEAD)"
      git push origin HEAD:main
      git push origin "$TAG"
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      echo "$GITHUB_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || echo "$GITHUB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan github.com >> ~/.ssh/known_hosts
      git push "git@github.com:justacalico/oasis-de.git" "$TAG:$TAG"
      CI_COMMIT_SHA="$(git rev-parse HEAD)" bash scripts/watch-github-run.sh
      bash scripts/sync-release.sh "$TAG"

release-assets:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - apk add --no-cache git curl python3 ca-certificates bash
    - bash scripts/sync-release.sh "$CI_COMMIT_TAG"

pages:
  stage: pages
  image: ghcr.io/cirruslabs/flutter:stable
  extends: .flutter
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - flutter config --enable-web
    - flutter pub get
    - mkdir -p public
    - cd landing && flutter build web --release --base-href /oasis-de/ -o ../public
    - cp -r ../public ../public-oasisde
    - cd ../de && flutter build web --release --base-href /oasis-de/app/ -o ../public/app
    - cd .. && mkdir -p public/oasis-de && cp -r public-oasisde/. public/oasis-de/ && mkdir -p public/oasis-de/app && cp -r public/app/. public/oasis-de/app/
  artifacts:
    paths:
      - public
