stages:
  - test
  - sync
  - release
  - pages

default:
  tags: [linux-truenas]

variables:
  COCOGITTO_VERSION: "7.0.0"

test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  script:
    - flutter pub get
    - flutter analyze
    - flutter test --coverage
    - |
      python3 - <<'PY'
      lf = lh = 0
      for line in open('coverage/lcov.info'):
          if line.startswith('LF:'):
              lf += int(line[3:])
          elif line.startswith('LH:'):
              lh += int(line[3:])
      print(f'line coverage {lh}/{lf}')
      assert lf > 0 and lh == lf, f'coverage {lh}/{lf} not 100%'
      PY
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
      - test/failures/

github-sync:
  stage: sync
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache git openssh-client curl python3
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$GITHUB_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || echo "$GITHUB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git remote add github git@github.com:justacalico/oasis-de.git || git remote set-url github git@github.com:justacalico/oasis-de.git
    - git fetch --unshallow github main 2>/dev/null || true
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push github "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG" --force
      else
        git push github HEAD:refs/heads/main --force-with-lease
      fi
    - sh scripts/watch-github-run.sh

auto-release:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache git openssh-client curl python3 ca-certificates tar gzip
    - curl -fsSL "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tgz
    - tar xzf /tmp/cog.tgz -C /usr/local/bin --strip-components=1
    - cog --version
    - git config user.email "ci@oasis.local" && git config user.name "ci"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch --unshallow 2>/dev/null || git fetch --all --tags
    - git tag -l | xargs -r git tag -d
    - git fetch --tags --force
    - |
      if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
        echo "HEAD already tagged, skipping"
        exit 0
      fi
      if ! cog bump --auto; then
        echo "no bump needed"
        exit 0
      fi
      TAG="$(git describe --tags --exact-match HEAD)"
      git push origin HEAD:main
      git push origin "$TAG"
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      echo "$GITHUB_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || echo "$GITHUB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan github.com >> ~/.ssh/known_hosts
      git push "git@github.com:justacalico/oasis-de.git" "$TAG:$TAG"
      CI_COMMIT_SHA="$(git rev-parse HEAD)" sh scripts/watch-github-run.sh
      sh scripts/sync-release.sh "$TAG"

release-assets:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - apk add --no-cache git curl python3 ca-certificates
    - sh scripts/sync-release.sh "$CI_COMMIT_TAG"

pages:
  stage: pages
  image: ghcr.io/cirruslabs/flutter:stable
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - flutter config --enable-web
    - flutter pub get
    - mkdir -p public
    - cd landing && flutter build web --release --base-href /oasis-de/ -o ../public
    - cp -r ../public ../public-oasisde
    - cd ../de && flutter build web --release --base-href /oasis-de/app/ -o ../public/app
    - cd .. && mkdir -p public/oasis-de && cp -r public-oasisde/. public/oasis-de/ && mkdir -p public/oasis-de/app && cp -r public/app/. public/oasis-de/app/
  artifacts:
    paths:
      - public
