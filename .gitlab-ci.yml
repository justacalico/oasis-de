stages:
  - test
  - sync
  - release
  - pages

default:
  tags: [linux-truenas]

variables:
  COCOGITTO_VERSION: "7.0.0"

test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  script:
    - flutter pub get
    - for p in packages/oasis_ui de apps/settings landing; do (cd $p && flutter pub get); done
    - flutter analyze
    - flutter test --coverage
    - |
      python3 - <<'PY'
      total = hit = 0
      for line in open('coverage/lcov.info'):
          if line.startswith('DA:'):
              total += 1
              if int(line.split(',')[1].strip()) > 0:
                  hit += 1
      pct = 100 * hit / total if total else 0
      print(f'coverage {pct:.1f}%')
      assert pct == 100.0, f'coverage {pct:.1f}% below 100%'
      PY

github-sync:
  stage: sync
  image: alpine/git:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - apk add --no-cache openssh-client curl jq
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$GITHUB_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || echo "$GITHUB_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git remote add github git@github.com:justacalico/oasis-de.git || git remote set-url github git@github.com:justacalico/oasis-de.git
    - git fetch --unshallow github main 2>/dev/null || true
    - git push github HEAD:main --force-with-lease
    - if [ -n "$CI_COMMIT_TAG" ]; then git push github "$CI_COMMIT_TAG" --force; fi
    - bash scripts/watch-github-run.sh

auto-release:
  stage: release
  image: ghcr.io/cocogitto/cocogitto:$COCOGITTO_VERSION
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - cog --version
    - NEXT=$(cog bump --auto --dry-run 2>/dev/null || true)
    - |
      if cog check --from-latest-tag >/dev/null 2>&1 && [ -z "$NEXT" ]; then
        echo "no conventional commits since last tag, skipping release"
      else
        cog bump --auto || true
      fi
    - NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
    - |
      if [ -n "$NEW_TAG" ]; then
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:main --follow-tags
        if [ -n "$GITLAB_TRIGGER_TOKEN" ]; then
          curl -fsS -X POST -F token="$GITLAB_TRIGGER_TOKEN" -F ref="$NEW_TAG" "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/trigger/pipeline" || true
        fi
      fi

release-assets:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  needs: ["github-sync"]
  script:
    - apk add --no-cache curl git
    - git fetch --unshallow 2>/dev/null || true
    - bash scripts/sync-release.sh "$CI_COMMIT_TAG"

pages:
  stage: pages
  image: ghcr.io/cirruslabs/flutter:stable
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - flutter config --enable-web
    - flutter pub get
    - (cd packages/oasis_ui && flutter pub get)
    - (cd landing && flutter pub get)
    - mkdir -p public
    - cd landing && flutter build web --release --base-href /oasis-de/ -o ../public
    - cd ../de && flutter pub get && flutter build web --release --base-href /oasis-de/app/ -o ../public/app
  artifacts:
    paths:
      - public
