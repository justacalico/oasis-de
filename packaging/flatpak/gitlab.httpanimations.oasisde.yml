app-id: gitlab.httpanimations.oasisde
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: oasis
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --socket=session-bus
  - --device=dri
modules:
  - name: oasis
    buildsystem: simple
    build-commands:
      - mkdir -p /app/oasis
      - cp -a bundle/. /app/oasis/
      - chmod +x /app/oasis/oasis
      - install -Dm755 ../oasis-session /app/bin/oasis-session
      - ln -sf /app/oasis/oasis /app/bin/oasis
      - install -Dm644 ../gitlab.httpanimations.oasisde.desktop /app/share/applications/gitlab.httpanimations.oasisde.desktop
      - install -Dm644 ../gitlab.httpanimations.oasisde.png /app/share/icons/hicolor/1024x1024/apps/gitlab.httpanimations.oasisde.png
    sources:
      - type: dir
        path: bundle
      - type: file
        path: ../packaging/oasis-session
      - type: file
        path: ../de/linux/data/gitlab.httpanimations.oasisde.desktop
      - type: file
        path: ../de/linux/data/gitlab.httpanimations.oasisde.png
