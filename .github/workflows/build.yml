name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: for p in packages/oasis_ui de apps/settings landing; do (cd $p && flutter pub get); done
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Coverage check
        run: |
          python3 - <<'PY'
          total = hit = 0
          for line in open('coverage/lcov.info'):
              if line.startswith('DA:'):
                  total += 1
                  if int(line.split(',')[1].strip()) > 0:
                      hit += 1
          assert hit == total, f'coverage {hit}/{total}'
          print('coverage 100%')
          PY
      - run: cd de && flutter build linux --release
      - run: cd de && flutter build web --release
      - name: Package Linux
        run: |
          cd de/build/linux/x64/release/bundle
          tar czf ../../../../../oasis-linux-x64.tar.gz .
          cd ../../../../../
      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: oasis-linux-x64
          path: oasis-linux-x64.tar.gz
          retention-days: 400
      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: oasis-web
          path: de/build/web
          retention-days: 400
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload "$GITHUB_REF_NAME" oasis-linux-x64.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: for p in packages/oasis_ui de apps/settings landing; do (cd $p && flutter pub get); done
      - run: cd de && flutter build linux --release
      - name: Package Linux arm64
        run: |
          cd de/build/linux/arm64/release/bundle
          tar czf ../../../../../oasis-linux-arm64.tar.gz .
          cd ../../../../../
      - name: Upload Linux arm64
        uses: actions/upload-artifact@v4
        with:
          name: oasis-linux-arm64
          path: oasis-linux-arm64.tar.gz
          retention-days: 400
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload "$GITHUB_REF_NAME" oasis-linux-arm64.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
