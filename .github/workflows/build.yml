name: build
permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Install Linux desktop deps
        run: sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libwayland-dev libxkbcommon-dev wayland-protocols libwayland-bin libdrm-dev libegl-dev libgles-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage/lcov.info
            test/failures/
          if-no-files-found: ignore
      - name: Coverage check
        run: |
          python3 - <<'PY'
          lf = lh = 0
          bad = []
          cur = None
          for line in open('coverage/lcov.info'):
              if line.startswith('SF:'):
                  cur = line[3:].strip()
              elif line.startswith('LF:'):
                  lf += int(line[3:])
              elif line.startswith('LH:'):
                  lh += int(line[3:])
              elif line.startswith('DA:') and line.strip().endswith(',0'):
                  bad.append(f'{cur}:{line.strip()}')
          assert lf > 0 and lh == lf, f'coverage {lh}/{lf}: {bad}'
          print('coverage 100%')
          PY
      - name: wlroots
        run: |
          sudo apt-get install -y meson ninja-build pkg-config libxkbcommon-dev libpixman-1-dev libudev-dev libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev libxcb1-dev libxcb-composite0-dev libxcb-icccm4-dev libxcb-ewmh-dev libxcb-render0-dev libxcb-res0-dev xwayland libffi-dev libexpat1-dev
          git clone --depth 1 --branch 1.26.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          meson setup /tmp/wayland/build /tmp/wayland -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          ninja -C /tmp/wayland/build && sudo ninja -C /tmp/wayland/build install && sudo ldconfig
          git clone --depth 1 --branch 1.49 https://gitlab.freedesktop.org/wayland/wayland-protocols.git /tmp/wayland-protocols
          meson setup /tmp/wproto/build /tmp/wayland-protocols -Dtests=false && ninja -C /tmp/wproto/build && sudo ninja -C /tmp/wproto/build install
          git clone --depth 1 --branch pixman-0.44.2 https://gitlab.freedesktop.org/pixman/pixman.git /tmp/pixman
          meson setup /tmp/pixman/build /tmp/pixman -Dtests=disabled -Ddemos=disabled -Dgtk=disabled && ninja -C /tmp/pixman/build && sudo ninja -C /tmp/pixman/build install && sudo ldconfig
          export PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:$PKG_CONFIG_PATH
          git clone --depth 1 --branch 0.20.2 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
          meson setup /tmp/wlroots/build /tmp/wlroots -Dxwayland=enabled -Dexamples=false -Drenderers=gles2 -Dallocators=gbm -Dsession=disabled -Dwerror=false
          ninja -C /tmp/wlroots/build
          sudo ninja -C /tmp/wlroots/build install && sudo ldconfig
      - run: cd de && flutter build linux --release
      - run: cd de && flutter build web --release
      - name: Package Linux
        run: |
          cd de/build/linux/x64/release/bundle
          tar czf ../../../../../../oasis-linux-x64.tar.gz .
          cd ../../../../../
      - name: Build RPM
        run: |
          sudo apt-get install -y rpm patchelf
          ver="${GITHUB_REF_NAME#v}"
          echo "$ver" | grep -qE '^[0-9]+(\.[0-9]+)*$' || ver="0.0.0"
          bash scripts/build-rpm.sh de/build/linux/x64/release/bundle "$ver" dist
      - name: Upload RPM x64
        uses: actions/upload-artifact@v4
        with:
          name: oasis-linux-x64-rpm
          path: dist/*.rpm
          retention-days: 400
      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: oasis-linux-x64
          path: oasis-linux-x64.tar.gz
          retention-days: 400
      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: oasis-web
          path: de/build/web
          retention-days: 400
      - name: Create release and upload assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" oasis-linux-x64.tar.gz --clobber
          gh release upload "$GITHUB_REF_NAME" dist/*.rpm --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop deps
        run: sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev git libwayland-dev libxkbcommon-dev wayland-protocols libwayland-bin libdrm-dev libegl-dev libgles-dev
      - name: Install Flutter
        run: git clone https://github.com/flutter/flutter.git -b 3.47.7 --depth 1 "$HOME/flutter"
      - run: echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - name: wlroots
        run: |
          sudo apt-get install -y meson ninja-build pkg-config libxkbcommon-dev libpixman-1-dev libudev-dev libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev libxcb1-dev libxcb-composite0-dev libxcb-icccm4-dev libxcb-ewmh-dev libxcb-render0-dev libxcb-res0-dev xwayland libffi-dev libexpat1-dev
          git clone --depth 1 --branch 1.26.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          meson setup /tmp/wayland/build /tmp/wayland -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          ninja -C /tmp/wayland/build && sudo ninja -C /tmp/wayland/build install && sudo ldconfig
          git clone --depth 1 --branch 1.49 https://gitlab.freedesktop.org/wayland/wayland-protocols.git /tmp/wayland-protocols
          meson setup /tmp/wproto/build /tmp/wayland-protocols -Dtests=false && ninja -C /tmp/wproto/build && sudo ninja -C /tmp/wproto/build install
          git clone --depth 1 --branch pixman-0.44.2 https://gitlab.freedesktop.org/pixman/pixman.git /tmp/pixman
          meson setup /tmp/pixman/build /tmp/pixman -Dtests=disabled -Ddemos=disabled -Dgtk=disabled && ninja -C /tmp/pixman/build && sudo ninja -C /tmp/pixman/build install && sudo ldconfig
          export PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:$PKG_CONFIG_PATH
          git clone --depth 1 --branch 0.20.2 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
          meson setup /tmp/wlroots/build /tmp/wlroots -Dxwayland=enabled -Dexamples=false -Drenderers=gles2 -Dallocators=gbm -Dsession=disabled -Dwerror=false
          ninja -C /tmp/wlroots/build
          sudo ninja -C /tmp/wlroots/build install && sudo ldconfig
      - run: cd de && flutter build linux --release
      - name: Package Linux arm64
        run: |
          cd de/build/linux/arm64/release/bundle
          tar czf ../../../../../../oasis-linux-arm64.tar.gz .
          cd ../../../../../
      - name: Build RPM arm64
        run: |
          sudo apt-get install -y rpm patchelf
          ver="${GITHUB_REF_NAME#v}"
          echo "$ver" | grep -qE '^[0-9]+(\.[0-9]+)*$' || ver="0.0.0"
          bash scripts/build-rpm.sh de/build/linux/arm64/release/bundle "$ver" dist
      - name: Upload RPM arm64
        uses: actions/upload-artifact@v4
        with:
          name: oasis-linux-arm64-rpm
          path: dist/*.rpm
          retention-days: 400
      - name: Upload Linux arm64
        uses: actions/upload-artifact@v4
        with:
          name: oasis-linux-arm64
          path: oasis-linux-arm64.tar.gz
          retention-days: 400
      - name: Upload arm64 release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" oasis-linux-arm64.tar.gz --clobber
          gh release upload "$GITHUB_REF_NAME" dist/*.rpm --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
